# Workflow: build Android APK from a Capacitor TypeScript app and attach it to a GitHub Release
# Save this file as: .github/workflows/android-apk.yml

name: Android APK Build

# Run only when you push a version tag like v1.0.0
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # needed to create the Release

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java JDK (required by Android Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web app (TypeScript bundle)
        run: npm run build

      - name: Install Capacitor CLI + Android platform
        run: |
          npm install --save-dev @capacitor/cli
          npm install @capacitor/core @capacitor/android

      - name: Add & sync Android platform
        run: |
          npx cap add android
          npx cap sync android

      - name: Build debug APK (no signing needed)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK with tag name
        run: |
          mv android/app/build/outputs/apk/debug/app-debug.apk \
             "android/app/build/outputs/apk/debug/${GITHUB_REF_NAME}.apk"

      - name: Create GitHub Release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/${{ github.ref_name }}.apk
          generate_release_notes: true
